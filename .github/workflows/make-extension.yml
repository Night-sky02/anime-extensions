name: Make extension from URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site URL (ex: https://exemple.tld)"
        required: true
      name:
        description: "Extension name (ex: MonSite)"
        required: true
      lang:
        description: "Language code (fr, en, ...)"
        required: true
        default: "fr"
      nsfw:
        description: "Adult content site?"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the extension from the URL
        env:
          SITE_URL: ${{ inputs.url }}
          EXT_NAME: ${{ inputs.name }}
          EXT_LANG: ${{ inputs.lang }}
          EXT_NSFW: ${{ inputs.nsfw }}
        run: |
          pip install beautifulsoup4
          args=()
          if [ "$EXT_NSFW" = "true" ]; then args+=(--nsfw); fi
          python tools/aniyomi_gen.py "$SITE_URL" --name "$EXT_NAME" --lang "$EXT_LANG" --repo . --out ./out "${args[@]}"
          pkg=$(printf '%s' "$EXT_NAME" | tr -cd 'a-zA-Z0-9' | tr 'A-Z' 'a-z')
          lang=$(printf '%s' "$EXT_LANG" | cut -d- -f1 | tr 'A-Z' 'a-z')
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          echo "LANG_CODE=$lang" >> "$GITHUB_ENV"

      - name: Upload generated sources + report (always)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-sources-and-report
          path: |
            out/REPORT.md
            src/${{ env.LANG_CODE }}/${{ env.PKG }}
          if-no-files-found: warn

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Load only the new module (faster)
        run: |
          sed -i 's|^loadAllIndividualExtensions()|// loadAllIndividualExtensions()\nloadIndividualExtension("'"$LANG_CODE"'", "'"$PKG"'")|' settings.gradle.kts
          grep -n "loadIndividualExtension(\"$LANG_CODE\"" settings.gradle.kts

      - name: Build the APK
        run: ./gradlew ":src:${LANG_CODE}:${PKG}:assembleDebug"

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-apk
          path: src/${{ env.LANG_CODE }}/${{ env.PKG }}/build/outputs/apk/debug/*.apk
          if-no-files-found: error
